name: Authentication API Experiment

on:
    workflow_dispatch:
        inputs:
            treatment:
                description: 'Tratamento que Será Executado'
                type: choice
                options:
                    - A
                    - B
                required: true
                default: A

permissions:
    contents: read

jobs:
    # 1. Validação da aplicação
    validate:
        name: Validate - Tratamento ${{ inputs.treatment }}
        runs-on: ubuntu-24.04

        env:
            DATABASE_URL: 'file:./test.db'
            EVIDENCE_DIR: evidence/validate

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.14.0'
                  cache: npm

            - name: Initialize validation evidence
              shell: bash
              run: |
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  mkdir -p "$EVIDENCE_DIR"

                  {
                    echo "treatment=${{ inputs.treatment }}"
                    echo "run_id=${GITHUB_RUN_ID}"
                    echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
                    echo "commit=${GITHUB_SHA}"
                    echo "event=${GITHUB_EVENT_NAME}"
                    echo "node_version=$(node --version)"
                    echo "npm_version=$(npm --version)"
                  } > "$EVIDENCE_DIR/metadata.txt"

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma Client
              run: npx prisma generate

            - name: Run tests
              id: tests
              shell: bash
              run: |
                  set +e
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  npm test 2>&1 | tee "$EVIDENCE_DIR/tests.log"
                  status=${PIPESTATUS[0]}
                  echo "tests_exit_code=$status" >> "$EVIDENCE_DIR/metadata.txt"
                  exit "$status"

            - name: Build application
              id: build
              if: always() && steps.tests.outcome == 'success'
              shell: bash
              run: |
                  set +e
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  npm run build 2>&1 | tee "$EVIDENCE_DIR/build.log"
                  status=${PIPESTATUS[0]}
                  echo "build_exit_code=$status" >> "$EVIDENCE_DIR/metadata.txt"
                  exit "$status"

            - name: Upload validation evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: validate-evidence-${{ inputs.treatment }}
                  path: evidence/validate/
                  if-no-files-found: warn
                  retention-days: 14

    # 2. Análise Estática do Código-Fonte (SAST - Semgrep)
    sast:
        name: SAST - Tratamento ${{ inputs.treatment }}
        runs-on: ubuntu-24.04
        needs: validate

        env:
            SAST_IMAGE: semgrep/semgrep:1.178.0
            EVIDENCE_DIR: evidence/sast

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Initialize SAST evidence
              shell: bash
              run: |
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  mkdir -p "$EVIDENCE_DIR"

                  {
                    echo "treatment=${{ inputs.treatment }}"
                    echo "run_id=${GITHUB_RUN_ID}"
                    echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
                    echo "commit=${GITHUB_SHA}"
                    echo "event=${GITHUB_EVENT_NAME}"
                    echo "semgrep_image=$SAST_IMAGE"
                    echo "semgrep_configs=p/security-audit,p/secrets,p/owasp-top-ten,p/javascript,p/typescript,p/nodejs,p/jwt"
                  } > "$EVIDENCE_DIR/metadata.txt"

            - name: Run Semgrep
              id: semgrep
              shell: bash
              run: |
                  set +e
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  docker run --rm \
                    -v "$GITHUB_WORKSPACE:/src:ro" \
                    -v "$EVIDENCE_DIR:/reports:rw" \
                    -w /src \
                    "$SAST_IMAGE" \
                    semgrep scan \
                      --config p/security-audit \
                      --config p/secrets \
                      --config p/owasp-top-ten \
                      --config p/javascript \
                      --config p/typescript \
                      --config p/nodejs \
                      --config p/jwt \
                      --exclude .github/ \
                      --exclude evidence/ \
                      --json \
                      --output /reports/semgrep-report.json \
                      /src \
                    > "$EVIDENCE_DIR/semgrep.log" 2>&1

                  status=$?
                  echo "semgrep_exit_code=$status" \
                    >> "$EVIDENCE_DIR/metadata.txt"

                  cat "$EVIDENCE_DIR/semgrep.log"

                  if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
                    echo "Falha na execução do Semgrep." \
                      | tee "$EVIDENCE_DIR/error.txt"
                    exit "$status"
                  fi

                  if [ ! -s "$EVIDENCE_DIR/semgrep-report.json" ]; then
                    echo "O Semgrep não gerou o relatório JSON esperado." \
                      | tee "$EVIDENCE_DIR/error.txt"
                    exit 1
                  fi

                  # Gera uma tabela auxiliar sem alterar o relatório original.
                  if command -v jq >/dev/null 2>&1; then
                    jq -r '
                      ["rule_id", "path", "line", "severity", "message"],
                      (.results[]? | [
                        .check_id,
                        .path,
                        (.start.line // 0),
                        (.extra.severity // "UNKNOWN"),
                        (.extra.message // "")
                      ]) | @tsv
                    ' "$EVIDENCE_DIR/semgrep-report.json" \
                      > "$EVIDENCE_DIR/semgrep-findings.tsv"
                  fi

            - name: Preserve SAST metadata
              if: always()
              shell: bash
              run: |
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  {
                    echo "runner_os=$RUNNER_OS"
                    echo "runner_arch=$RUNNER_ARCH"
                    echo "docker_version=$(docker --version 2>&1)"
                    echo "semgrep_image=$SAST_IMAGE"
                    docker image inspect "$SAST_IMAGE" \
                      --format 'image_digest={{index .RepoDigests 0}}' \
                      2>/dev/null || true
                  } >> "$EVIDENCE_DIR/metadata.txt"

                  if [ -f "$EVIDENCE_DIR/semgrep-report.json" ]; then
                    sha256sum "$EVIDENCE_DIR/semgrep-report.json" \
                      > "$EVIDENCE_DIR/report-sha256.txt"
                  fi

            - name: Upload SAST evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: sast-evidence-${{ inputs.treatment }}
                  path: evidence/sast/
                  if-no-files-found: warn
                  retention-days: 90

    # 3. Análise de Dependências Diretas e Transitivas (SCA - npm audit)
    sca:
        name: SCA - Tratamento ${{ inputs.treatment }}
        runs-on: ubuntu-24.04
        needs: validate

        env:
            EVIDENCE_DIR: evidence/sca

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.14.0'
                  cache: npm

            - name: Initialize SCA evidence
              shell: bash
              run: |
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  mkdir -p "$EVIDENCE_DIR"

                  {
                    echo "treatment=${{ inputs.treatment }}"
                    echo "run_id=${GITHUB_RUN_ID}"
                    echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
                    echo "commit=${GITHUB_SHA}"
                    echo "event=${GITHUB_EVENT_NAME}"
                    echo "node_version=$(node --version)"
                    echo "npm_version=$(npm --version)"
                  } > "$EVIDENCE_DIR/metadata.txt"

            - name: Install dependencies
              run: npm ci

            - name: Audit all dependencies
              id: audit_all
              shell: bash
              run: |
                  set +e
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  npm audit --json \
                    > "$EVIDENCE_DIR/npm-audit-all.json" \
                    2> "$EVIDENCE_DIR/npm-audit-all.log"

                  status=$?
                  echo "audit_all_exit_code=$status" \
                    >> "$EVIDENCE_DIR/metadata.txt"

                  if [ "$status" -ne 0 ] && \
                    ! jq -e '.auditReportVersion and .metadata.vulnerabilities' \
                      "$EVIDENCE_DIR/npm-audit-all.json" >/dev/null 2>&1; then
                    echo "Falha na execução do npm audit para todas as dependências." \
                      | tee "$EVIDENCE_DIR/error-all.txt"
                    exit 1
                  fi

            - name: Audit production dependencies
              id: audit_prod
              shell: bash
              run: |
                  set +e
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  npm audit --omit=dev --json \
                    > "$EVIDENCE_DIR/npm-audit-production.json" \
                    2> "$EVIDENCE_DIR/npm-audit-production.log"

                  status=$?
                  echo "audit_production_exit_code=$status" \
                    >> "$EVIDENCE_DIR/metadata.txt"

                  if [ "$status" -ne 0 ] && \
                    ! jq -e '.auditReportVersion and .metadata.vulnerabilities' \
                      "$EVIDENCE_DIR/npm-audit-production.json" >/dev/null 2>&1; then
                    echo "Falha na execução do npm audit para dependências de produção." \
                      | tee "$EVIDENCE_DIR/error-production.txt"
                    exit 1
                  fi

            - name: Upload SCA evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: sca-evidence-${{ inputs.treatment }}
                  path: evidence/sca/
                  if-no-files-found: warn
                  retention-days: 14

    # 4. Análise Dinâmica da Aplicação (DAST - OWASP ZAP)
    dast:
        name: DAST - Tratamento ${{ inputs.treatment }}
        runs-on: ubuntu-24.04
        needs: validate
        timeout-minutes: 45

        env:
            JWT_ACCESS_SECRET: 'dast-test-access-secret-CHANGE-ME-123456789'
            JWT_REFRESH_SECRET: 'dast-test-refresh-secret-CHANGE-ME-123456789'
            DAST_BASE_URL: http://127.0.0.1:3000
            ZAP_BASE_URL: http://host.docker.internal:3000
            ZAP_API_URL: http://127.0.0.1:8080
            DAST_PLAN: .github/workflows/config/dast.rules.yml
            DAST_IMAGE: authentication-api:dast-${{ inputs.treatment }}
            ZAP_IMAGE: zaproxy/zap-stable:2.17.0
            EVIDENCE_DIR: evidence/dast

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Initialize DAST evidence
              shell: bash
              run: |
                  set -euo pipefail

                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  mkdir -p "$EVIDENCE_DIR"

                  {
                    echo "treatment=${{ inputs.treatment }}"
                    echo "run_id=${GITHUB_RUN_ID}"
                    echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
                    echo "commit=${GITHUB_SHA}"
                    echo "event=${GITHUB_EVENT_NAME}"
                    echo "zap_image=$ZAP_IMAGE"
                    echo "dast_plan=$DAST_PLAN"
                  } > "$EVIDENCE_DIR/metadata.txt"

            - name: Build and start application
              shell: bash
              run: |
                  set -euo pipefail

                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  docker build \
                    -t "$DAST_IMAGE" . \
                    2>&1 | tee "$EVIDENCE_DIR/docker-build.log"

                  docker run -d \
                    --name dast-api \
                    --publish 3000:3000 \
                    --env NODE_ENV=test \
                    --env DATABASE_URL='file:./test.db' \
                    --env JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET" \
                    --env JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
                    "$DAST_IMAGE" \
                    > "$EVIDENCE_DIR/container-id.txt"

                  # Aguarda a API disponibilizar sua especificação OpenAPI.
                  ready=false

                  for attempt in $(seq 1 60); do
                    if curl -fsS --max-time 3 \
                      "$DAST_BASE_URL/openapi.json" \
                      -o "$EVIDENCE_DIR/openapi.json"; then

                      ready=true
                      break
                    fi

                    if [ "$(docker inspect -f '{{.State.Running}}' dast-api 2>/dev/null || echo false)" != true ]; then
                      break
                    fi

                    sleep 2
                  done

                  if [ "$ready" != true ] || \
                    ! jq -e '(.paths | type == "object") and (.paths | length > 0)' \
                    "$EVIDENCE_DIR/openapi.json" >/dev/null 2>&1; then

                    echo "::error::A API não disponibilizou uma especificação OpenAPI válida em /openapi.json."
                    exit 1
                  fi

                  # Registra a quantidade de caminhos e operações documentadas.
                  PATH_COUNT=$(jq '.paths | length' \
                    "$EVIDENCE_DIR/openapi.json")

                  OPERATION_COUNT=$(jq '
                    [
                      .paths[] |
                      to_entries[] |
                      select(
                        .key == "get" or
                        .key == "post" or
                        .key == "put" or
                        .key == "patch" or
                        .key == "delete" or
                        .key == "options" or
                        .key == "head" or
                        .key == "trace"
                      )
                    ] | length
                  ' "$EVIDENCE_DIR/openapi.json")

                  SECURITY_SCHEMES_COUNT=$(jq '
                    (.components.securitySchemes // {}) | length
                  ' "$EVIDENCE_DIR/openapi.json")

                  # Conta operações com segurança efetiva declarada.
                  # A segurança definida na operação substitui a global.
                  SECURED_OPERATION_COUNT=$(jq '
                    . as $spec |
                    [
                      .paths[]? |
                      to_entries[] |
                      select(
                        .key == "get" or
                        .key == "post" or
                        .key == "put" or
                        .key == "patch" or
                        .key == "delete" or
                        .key == "options" or
                        .key == "head" or
                        .key == "trace"
                      ) |
                      select(
                        if has("value") then
                          if (.value | has("security")) then
                            ((.value.security // []) | length) > 0
                          else
                            (($spec.security // []) | length) > 0
                          end
                        else
                          false
                        end
                      )
                    ] | length
                  ' "$EVIDENCE_DIR/openapi.json")

                  {
                    echo "openapi_paths=$PATH_COUNT"
                    echo "openapi_operations=$OPERATION_COUNT"
                    echo "openapi_security_schemes=$SECURITY_SCHEMES_COUNT"
                    echo "openapi_secured_operations=$SECURED_OPERATION_COUNT"
                  } >> "$EVIDENCE_DIR/metadata.txt"

                  echo "OpenAPI paths: $PATH_COUNT"
                  echo "OpenAPI operations: $OPERATION_COUNT"
                  echo "OpenAPI security schemes: $SECURITY_SCHEMES_COUNT"
                  echo "OpenAPI secured operations: $SECURED_OPERATION_COUNT"

            - name: Inspect OpenAPI operationIds
              shell: bash
              run: |
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  jq -r '
                    .paths | to_entries[] |
                    .key as $path |
                    .value | to_entries[] |
                    select(
                      .key == "get" or
                      .key == "post" or
                      .key == "put" or
                      .key == "patch" or
                      .key == "delete"
                    ) |
                    "\(.key | ascii_upcase) \($path) -> \(.value.operationId // "SEM operationId")"
                  ' "$EVIDENCE_DIR/openapi.json"

            # Baixa a imagem antes de gerar o token para reduzir o tempo de espera.
            - name: Pull OWASP ZAP image
              shell: bash
              run: |
                  set -euo pipefail
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  docker pull "$ZAP_IMAGE" \
                    2>&1 | tee "$EVIDENCE_DIR/zap-pull.log"

            - name: Prepare authenticated DAST session
              shell: bash
              run: |
                  set -euo pipefail

                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  node .github/workflows/config/scripts/prepare-dast-auth.mjs \
                    "$EVIDENCE_DIR/openapi.json" \
                    "$DAST_BASE_URL" \
                    "$EVIDENCE_DIR/authentication-evidence.json"

                  test -s "$EVIDENCE_DIR/authentication-http-traffic.json"

                  jq -e '
                    (.exchanges | type == "array") and
                    (.exchanges | length == 3)
                  ' "$EVIDENCE_DIR/authentication-http-traffic.json" >/dev/null

            - name: Run OWASP ZAP Automation Framework
              shell: bash
              run: |
                  set -Eeuo pipefail

                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  # Prepara o diretório de evidências.
                  mkdir -p "$EVIDENCE_DIR"
                  chmod 0777 "$EVIDENCE_DIR"

                  # Preserva o plano utilizado na execução.
                  cp "$DAST_PLAN" "$EVIDENCE_DIR/dast.rules.yml"

                  # Registra a identidade exata da imagem utilizada.
                  ZAP_IMAGE_ID=$(docker image inspect "$ZAP_IMAGE" \
                    --format '{{.Id}}')

                  ZAP_IMAGE_DIGEST=$(docker image inspect "$ZAP_IMAGE" \
                    --format '{{json .RepoDigests}}')

                  # Gera uma chave exclusiva para a API do ZAP.
                  KEY=$(openssl rand -hex 32)

                  # Inicializa o ZAP em modo daemon.
                  # As variáveis de autenticação são encaminhadas ao container.
                  docker run -d \
                    --name dast-zap \
                    --add-host=host.docker.internal:host-gateway \
                    --publish 127.0.0.1:8080:8080 \
                    --volume "$GITHUB_WORKSPACE:/zap/wrk:ro" \
                    --volume "$EVIDENCE_DIR:/zap/out:rw" \
                    --env ZAP_AUTH_HEADER_VALUE \
                    --env ZAP_AUTH_HEADER \
                    --env ZAP_AUTH_HEADER_SITE \
                    "$ZAP_IMAGE" \
                    zap.sh -daemon \
                      -host 0.0.0.0 \
                      -port 8080 \
                      -config "api.key=$KEY" \
                      -config "api.addrs.addr.name=.*" \
                      -config "api.addrs.addr.regex=true"

                  # Aguarda a inicialização da API do ZAP.
                  ready=false

                  for attempt in $(seq 1 90); do
                    if curl -fsS --max-time 5 \
                      -G "$ZAP_API_URL/JSON/core/view/version/" \
                      --data-urlencode "apikey=$KEY" \
                      -o "$EVIDENCE_DIR/zap-version.json"; then

                      ready=true
                      break
                    fi

                    sleep 2
                  done

                  if [ "$ready" != true ]; then
                    echo "::error::O OWASP ZAP não iniciou corretamente."

                    docker logs dast-zap --tail 100 \
                      > "$EVIDENCE_DIR/zap-startup-error.log" 2>&1 || true

                    exit 1
                  fi

                  # Verifica a autenticação através do próprio proxy do ZAP.
                  # O curl não envia Authorization: o cabeçalho deve ser injetado
                  # pelas variáveis ZAP_AUTH_HEADER_* carregadas pelo processo.
                  if [ -z "${DAST_ZAP_PROFILE_URL:-}" ]; then
                    echo "::error::A URL dinâmica do perfil protegido não foi fornecida."
                    exit 1
                  fi

                  if ! AUTH_PREFLIGHT_STATUS=$(curl --silent --show-error \
                    --max-time 15 \
                    --proxy http://127.0.0.1:8080 \
                    --noproxy "" \
                    --output /dev/null \
                    --write-out '%{http_code}' \
                    "$DAST_ZAP_PROFILE_URL"); then
                    AUTH_PREFLIGHT_STATUS=000
                  fi

                  echo "zap_auth_preflight_status=$AUTH_PREFLIGHT_STATUS" \
                    >> "$EVIDENCE_DIR/metadata.txt"

                  # O status é preservado como evidência; sua coerência será avaliada
                  # posteriormente, junto ao HAR e às demais evidências HTTP.

                  ZAP_VERSION=$(jq -r '.version // "unknown"' \
                    "$EVIDENCE_DIR/zap-version.json")

                  echo "zap_version=$ZAP_VERSION" \
                    >> "$EVIDENCE_DIR/metadata.txt"

                  # Confirma a versão principal esperada.
                  if [ "$ZAP_VERSION" != "2.17.0" ]; then
                    echo "::error::Versão inesperada do OWASP ZAP: $ZAP_VERSION."
                    exit 1
                  fi

                  # Executa o plano nativo do Automation Framework.
                  curl -fsS -G \
                    "$ZAP_API_URL/JSON/automation/action/runPlan/" \
                    --data-urlencode "apikey=$KEY" \
                    --data-urlencode "filePath=/zap/wrk/$DAST_PLAN" \
                    -o "$EVIDENCE_DIR/zap-plan-start.json"

                  PLAN_ID=$(jq -r '.planId // empty' \
                    "$EVIDENCE_DIR/zap-plan-start.json")

                  if [ -z "$PLAN_ID" ]; then
                    echo "::error::Não foi possível iniciar o plano de automação do ZAP."
                    cat "$EVIDENCE_DIR/zap-plan-start.json"
                    exit 1
                  fi

                  echo "zap_plan_id=$PLAN_ID" \
                    >> "$EVIDENCE_DIR/metadata.txt"

                  # Aguarda a conclusão do plano.
                  completed=false

                  for attempt in $(seq 1 900); do
                    if curl -fsS -G \
                      "$ZAP_API_URL/JSON/automation/view/planProgress/" \
                      --data-urlencode "apikey=$KEY" \
                      --data-urlencode "planId=$PLAN_ID" \
                      -o "$EVIDENCE_DIR/zap-plan-progress.json"; then

                      if jq -e '
                        has("finished") and
                        (.finished != null) and
                        (.finished != "")
                      ' "$EVIDENCE_DIR/zap-plan-progress.json" >/dev/null; then

                        completed=true
                        break
                      fi
                    fi

                    sleep 2
                  done

                  if [ "$completed" != true ]; then
                    echo "::error::Tempo limite da execução do plano ZAP."

                    curl -fsS -G \
                      "$ZAP_API_URL/JSON/automation/action/stopPlan/" \
                      --data-urlencode "apikey=$KEY" \
                      --data-urlencode "planId=$PLAN_ID" \
                      -o "$EVIDENCE_DIR/zap-plan-stop.json" || true

                    exit 1
                  fi

                  # Verifica se a autenticação continua válida após a varredura.
                  # A chamada também passa pelo proxy do ZAP, sem enviar o token pelo runner.
                  if ! AUTH_POSTFLIGHT_STATUS=$(curl --silent --show-error \
                    --max-time 15 \
                    --proxy http://127.0.0.1:8080 \
                    --noproxy "" \
                    --output /dev/null \
                    --write-out '%{http_code}' \
                    "$DAST_ZAP_PROFILE_URL"); then
                    AUTH_POSTFLIGHT_STATUS=000
                  fi

                  echo "zap_auth_postflight_status=$AUTH_POSTFLIGHT_STATUS" \
                    >> "$EVIDENCE_DIR/metadata.txt"

                  # Preserva os resultados do Automation Framework.
                  PLAN_ERRORS=$(jq '(.error // []) | length' \
                    "$EVIDENCE_DIR/zap-plan-progress.json")

                  PLAN_WARNINGS=$(jq '(.warn // []) | length' \
                    "$EVIDENCE_DIR/zap-plan-progress.json")

                  jq -r '(.info // [])[]?' \
                    "$EVIDENCE_DIR/zap-plan-progress.json" \
                    > "$EVIDENCE_DIR/zap-plan-info.log"

                  jq -r '(.warn // [])[]?' \
                    "$EVIDENCE_DIR/zap-plan-progress.json" \
                    > "$EVIDENCE_DIR/zap-plan-warnings.log"

                  jq -r '(.error // [])[]?' \
                    "$EVIDENCE_DIR/zap-plan-progress.json" \
                    > "$EVIDENCE_DIR/zap-plan-errors.log"

                  # Verifica os relatórios gerados pelos jobs nativos.
                  REPORTS_OK=true

                  if [ ! -s "$EVIDENCE_DIR/dast-report.json" ]; then
                    REPORTS_OK=false
                  fi

                  if [ ! -s "$EVIDENCE_DIR/dast-report.html" ]; then
                    REPORTS_OK=false
                  fi

                  if [ -s "$EVIDENCE_DIR/dast-report.json" ]; then
                    jq -e . "$EVIDENCE_DIR/dast-report.json" \
                      >/dev/null 2>&1 || REPORTS_OK=false
                  fi

                  # Exige o HAR com as mensagens HTTP geradas pelo próprio ZAP.
                  if [ ! -s "$EVIDENCE_DIR/dast-http-traffic.har" ]; then
                    REPORTS_OK=false
                  elif ! jq -e '
                    (.log.entries | type == "array")
                  ' "$EVIDENCE_DIR/dast-http-traffic.har" >/dev/null 2>&1; then
                    REPORTS_OK=false
                  fi

                  # Exige a evidência sanitizada das chamadas feitas pelo script.
                  if [ ! -s "$EVIDENCE_DIR/authentication-http-traffic.json" ]; then
                    REPORTS_OK=false
                  elif ! jq -e '
                    (.exchanges | type == "array") and
                    (.exchanges | length == 3)
                  ' "$EVIDENCE_DIR/authentication-http-traffic.json" >/dev/null 2>&1; then
                    REPORTS_OK=false
                  fi

                  # Preserva os metadados da execução.
                  {
                    echo "zap_image=$ZAP_IMAGE"
                    echo "zap_image_id=$ZAP_IMAGE_ID"
                    echo "zap_image_digest=$ZAP_IMAGE_DIGEST"
                    echo "zap_plan_completed=true"
                    echo "zap_plan_errors=$PLAN_ERRORS"
                    echo "zap_plan_warnings=$PLAN_WARNINGS"
                    echo "zap_reports_generated=$REPORTS_OK"
                    echo "zap_http_traffic_har_generated=$([ -s "$EVIDENCE_DIR/dast-http-traffic.har" ] && echo true || echo false)"
                    echo "authentication_http_exchanges=$(jq -r '.exchanges | length' "$EVIDENCE_DIR/authentication-http-traffic.json" 2>/dev/null || echo 0)"
                  } >> "$EVIDENCE_DIR/metadata.txt"

                  # Erros tornam a execução inválida.
                  if [ "$PLAN_ERRORS" -gt 0 ]; then
                    echo "::error::O plano ZAP apresentou erros."
                    exit 1
                  fi

                  # Avisos são preservados para análise.
                  if [ "$PLAN_WARNINGS" -gt 0 ]; then
                    echo "::warning::O plano ZAP apresentou avisos. Consulte zap-plan-warnings.log."
                  fi

                  # Ausência ou corrupção dos relatórios invalida a execução.
                  if [ "$REPORTS_OK" != true ]; then
                    echo "::error::Os relatórios DAST não foram gerados corretamente."
                    exit 1
                  fi

                  # O status final também é apenas evidência.
                  # Respostas como HTTP 401 podem ser consequências esperadas
                  # de operações executadas durante o scan, como o logout.

                  # Calcula o hash do relatório original.
                  sha256sum "$EVIDENCE_DIR/dast-report.json" \
                    > "$EVIDENCE_DIR/dast-report-sha256.txt"

            - name: Preserve DAST configuration and metadata
              if: always()
              shell: bash
              run: |
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  mkdir -p "$EVIDENCE_DIR"

                  {
                    echo "runner_os=$RUNNER_OS"
                    echo "runner_arch=$RUNNER_ARCH"
                    echo "docker_version=$(docker --version 2>&1)"

                    docker image inspect "$ZAP_IMAGE" \
                      --format 'zap_image_id={{.Id}}' \
                      2>/dev/null || true

                    docker image inspect "$ZAP_IMAGE" \
                      --format 'zap_image_digest={{json .RepoDigests}}' \
                      2>/dev/null || true
                  } >> "$EVIDENCE_DIR/metadata.txt"

                  if [ -f "$DAST_PLAN" ]; then
                    cp "$DAST_PLAN" "$EVIDENCE_DIR/dast.rules.yml"
                  fi

                  if [ -f "$EVIDENCE_DIR/dast-report.json" ]; then
                    sha256sum "$EVIDENCE_DIR/dast-report.json" \
                      > "$EVIDENCE_DIR/dast-report-sha256.txt"
                  fi

            - name: Collect DAST evidence
              if: always()
              shell: bash
              run: |
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  mkdir -p "$EVIDENCE_DIR"

                  docker logs dast-api \
                    > "$EVIDENCE_DIR/application.log" 2>&1 || true

                  docker logs dast-zap \
                    > "$EVIDENCE_DIR/zap.log" 2>&1 || true

                  docker rm -f dast-zap dast-api \
                    >/dev/null 2>&1 || true

                  docker image rm "$DAST_IMAGE" \
                    >/dev/null 2>&1 || true

            - name: Sanitize DAST evidence
              if: always()
              shell: bash
              run: |
                  set -euo pipefail

                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  # Recupera a propriedade dos arquivos criados pelo container ZAP.
                  sudo chown -R "$(id -u):$(id -g)" "$EVIDENCE_DIR"

                  python3 - "$EVIDENCE_DIR" <<'PY'
                  import base64
                  import json
                  import os
                  import re
                  import sys
                  from pathlib import Path
                  from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

                  root = Path(sys.argv[1])
                  token = os.environ.get("ZAP_AUTH_HEADER_VALUE", "")

                  def secret(name):
                      name = re.sub(r"[^a-z0-9]", "", str(name).lower())
                      return name in ("pass", "pwd") or any(
                          key in name for key in (
                              "authorization", "password", "senha", "passphrase",
                              "token", "secret", "cookie", "apikey", "credential"
                          )
                      )

                  def clean(value):
                      if not isinstance(value, str):
                          return value
                      if token:
                          value = value.replace(token, "[REDACTED]")
                      value = re.sub(r"(?i)Bearer\s+\S+", "Bearer [REDACTED]", value)
                      return re.sub(
                          r"\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b",
                          "[REDACTED_JWT]", value
                      )

                  def clean_json(value, key=""):
                      if secret(key):
                          return "[REDACTED]"
                      if isinstance(value, dict):
                          return {k: clean_json(v, k) for k, v in value.items()}
                      if isinstance(value, list):
                          return [clean_json(v) for v in value]
                      return clean(value)

                  def clean_body(value):
                      try:
                          return json.dumps(
                              clean_json(json.loads(value)),
                              ensure_ascii=False,
                              separators=(",", ":")
                          )
                      except (ValueError, TypeError):
                          return clean(value)

                  def clean_message(message):
                      for header in message.get("headers", []):
                          name = header.get("name", "")
                          header["value"] = (
                              "[REDACTED]" if secret(name)
                              else clean(header.get("value", ""))
                          )

                      for cookie in message.get("cookies", []):
                          cookie["value"] = "[REDACTED]"

                  # Logs da aplicação e do ZAP.
                  for name in ("application.log", "zap.log"):
                      path = root / name
                      if path.is_file():
                          content = clean(path.read_text(
                              encoding="utf-8", errors="replace"
                          ))
                          content = re.sub(
                              r"(Setting config api\.key = )[0-9a-fA-F]+",
                              r"\1[REDACTED]", content
                          )
                          path.write_text(content, encoding="utf-8")

                  # Histórico HTTP HAR.
                  path = root / "dast-http-traffic.har"
                  if path.is_file():
                      har = json.loads(path.read_text(encoding="utf-8"))

                      for entry in har.get("log", {}).get("entries", []):
                          request = entry.get("request", {})
                          response = entry.get("response", {})

                          clean_message(request)
                          clean_message(response)

                          for item in request.get("queryString", []):
                              if secret(item.get("name", "")):
                                  item["value"] = "[REDACTED]"
                              else:
                                  item["value"] = clean(item.get("value", ""))

                          post = request.get("postData", {})
                          for item in post.get("params", []):
                              if secret(item.get("name", "")):
                                  item["value"] = "[REDACTED]"
                              else:
                                  item["value"] = clean(item.get("value", ""))

                          if isinstance(post.get("text"), str):
                              post["text"] = clean_body(post["text"])

                          content = response.get("content", {})
                          body = content.get("text")

                          if isinstance(body, str):
                              if content.get("encoding") == "base64":
                                  try:
                                      decoded = base64.b64decode(body).decode("utf-8")
                                      content["text"] = base64.b64encode(
                                          clean_body(decoded).encode("utf-8")
                                      ).decode("ascii")
                                  except (ValueError, UnicodeDecodeError):
                                      pass
                              else:
                                  content["text"] = clean_body(body)

                          if isinstance(request.get("url"), str):
                              parts = urlsplit(request["url"])
                              query = [
                                  (key, "[REDACTED]" if secret(key) else clean(value))
                                  for key, value in parse_qsl(
                                      parts.query, keep_blank_values=True
                                  )
                              ]
                              request["url"] = urlunsplit((
                                  parts.scheme, parts.netloc, parts.path,
                                  urlencode(query), parts.fragment
                              ))

                      path.write_text(
                          json.dumps(har, ensure_ascii=False, indent=2) + "\n",
                          encoding="utf-8"
                      )

                  PY

            - name: Upload DAST evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: dast-evidence-${{ inputs.treatment }}
                  path: evidence/dast/
                  if-no-files-found: warn
                  retention-days: 90

    # 5. Artefato Final de Análise SAST, DAST e SCA
    analysis:
        name: Consolidated Security Analysis - Tratamento ${{ inputs.treatment }}
        runs-on: ubuntu-24.04
        needs: [validate, sast, sca, dast]
        if: ${{ always() }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download security evidence
              uses: actions/download-artifact@v4
              with:
                  pattern: '*-evidence-*'
                  path: collected
                  merge-multiple: true

            - name: Inspect downloaded evidence
              shell: bash
              run: |
                  echo "Arquivos recebidos dos artefatos:"
                  if [ -d collected ]; then
                    find collected -type f -print | sort
                  else
                    echo "::warning::Diretório collected não foi criado."
                  fi

            - name: Generate consolidated analysis report
              shell: bash
              env:
                  TREATMENT: ${{ inputs.treatment }}
                  VALIDATE_STATUS: ${{ needs.validate.result }}
                  SAST_STATUS: ${{ needs.sast.result }}
                  SCA_STATUS: ${{ needs.sca.result }}
                  DAST_STATUS: ${{ needs.dast.result }}
              run: |
                  set -euo pipefail

                  mkdir -p analysis/reports
                  REPORTS="analysis/reports"
                  OUTPUT="analysis/analysis.md"

                  copy_report() {
                    local source="$1"
                    local target="$2"

                    if [ -n "$source" ] && [ -s "$source" ] &&
                      jq -e 'type == "object"' "$source" >/dev/null 2>&1; then
                      cp "$source" "$REPORTS/$target"
                      echo "Incluído: $target"
                    else
                      echo "::warning::Relatório ausente ou inválido: $source"
                    fi
                  }

                  find_report() {
                    local filename="$1"
                    find collected -type f -name "$filename" -print -quit 2>/dev/null || true
                  }

                  copy_report "$(find_report semgrep-report.json)" sast-report.json
                  copy_report "$(find_report npm-audit-all.json)" sca-all-report.json
                  copy_report "$(find_report npm-audit-production.json)" sca-production-report.json
                  copy_report "$(find_report dast-report.json)" dast-report.json

                  {
                    echo "# Relatório consolidado de segurança"
                    echo
                    echo "## Identificação da execução"
                    echo
                    echo "- Repositório: \`$GITHUB_REPOSITORY\`"
                    echo "- Execução: \`$GITHUB_RUN_ID\`"
                    echo "- Tentativa: \`$GITHUB_RUN_ATTEMPT\`"
                    echo "- Commit: \`$GITHUB_SHA\`"
                    echo "- Tratamento experimental: \`$TREATMENT\`"
                    echo "- Data UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
                    echo
                    echo "## Estado dos jobs"
                    echo
                    echo "| Etapa | Resultado do GitHub Actions |"
                    echo "|---|---|"
                    echo "| Validação | $VALIDATE_STATUS |"
                    echo "| SAST | $SAST_STATUS |"
                    echo "| SCA | $SCA_STATUS |"
                    echo "| DAST | $DAST_STATUS |"
                    echo

                    echo "## SAST — Semgrep"
                    echo

                    if [ -s "$REPORTS/sast-report.json" ]; then
                      jq -r '
                        "| Métrica | Quantidade |",
                        "|---|---:|",
                        "| Achados reportados | \((.results // []) | length) |",
                        "| Erros reportados pela ferramenta | \((.errors // []) | length) |",
                        "",
                        "| Severidade original | Quantidade |",
                        "|---|---:|",
                        (
                          [.results[]?.extra.severity // "UNKNOWN"]
                          | sort
                          | group_by(.)
                          | .[]
                          | "| \(.[0]) | \(length) |"
                        )
                      ' "$REPORTS/sast-report.json"
                    else
                      echo "Relatório SAST ausente ou inválido; não foi possível determinar os totais."
                    fi

                    echo
                    echo "## SCA — npm audit"
                    echo

                    for file in sca-all-report.json sca-production-report.json; do
                      echo "### $file"
                      echo

                      if [ -s "$REPORTS/$file" ] &&
                        jq -e '.metadata.vulnerabilities | type == "object"' \
                          "$REPORTS/$file" >/dev/null 2>&1; then

                        if [ "$file" = "sca-production-report.json" ]; then
                          jq -r '
                            "| Severidade original | Quantidade |",
                            "|---|---:|",
                            "| Critical | \(.metadata.vulnerabilities.critical // 0) |",
                            "| High | \(.metadata.vulnerabilities.high // 0) |",
                            "| Moderate | \(.metadata.vulnerabilities.moderate // 0) |",
                            "| Low | \(.metadata.vulnerabilities.low // 0) |",
                            "| Info | \(.metadata.vulnerabilities.info // 0) |",
                            "| Total reportado | \(.metadata.vulnerabilities.total // 0) |",
                            "",
                            "Dependências de produção analisadas: \(.metadata.dependencies.prod // 0)"
                          ' "$REPORTS/$file"
                        else
                          jq -r '
                            "| Severidade original | Quantidade |",
                            "|---|---:|",
                            "| Critical | \(.metadata.vulnerabilities.critical // 0) |",
                            "| High | \(.metadata.vulnerabilities.high // 0) |",
                            "| Moderate | \(.metadata.vulnerabilities.moderate // 0) |",
                            "| Low | \(.metadata.vulnerabilities.low // 0) |",
                            "| Info | \(.metadata.vulnerabilities.info // 0) |",
                            "| Total reportado | \(.metadata.vulnerabilities.total // 0) |",
                            "",
                            "Dependências analisadas: \(.metadata.dependencies.total // 0)"
                          ' "$REPORTS/$file"
                        fi
                      else
                        echo "Relatório ausente ou sem estrutura válida de vulnerabilidades."
                      fi

                      echo
                    done

                    echo "## DAST — OWASP ZAP"
                    echo

                    if [ -s "$REPORTS/dast-report.json" ]; then
                      jq -r '
                        [
                          .site[]?.alerts[]? as $alert
                          | ($alert.instances // [])[]
                          | (
                              if (($alert.riskcode // "" | tostring) == "3") then "High"
                              elif (($alert.riskcode // "" | tostring) == "2") then "Medium"
                              elif (($alert.riskcode // "" | tostring) == "1") then "Low"
                              elif (($alert.riskcode // "" | tostring) == "0") then "Informational"
                              else "Unknown"
                              end
                            )
                        ] as $severities |

                        "| Severidade | Quantidade de ocorrências |",
                        "|---|---:|",
                        (
                          ["High", "Medium", "Low", "Informational", "Unknown"][] as $severity |
                          "| \($severity) | \([$severities[] | select(. == $severity)] | length) |"
                        ),
                        "| **Total** | **\($severities | length)** |"
                      ' "$REPORTS/dast-report.json"
                    else
                      echo "Relatório DAST não encontrado."
                    fi

                    echo
                    echo "## Limitações e interpretação"
                    echo
                    echo "- Os resultados representam achados reportados pelas ferramentas, não vulnerabilidades confirmadas individualmente."
                    echo "- As severidades são mantidas conforme a classificação original de cada ferramenta."
                    echo "- No SAST, os achados são contabilizados conforme os resultados presentes no JSON do Semgrep."
                    echo "- No SCA, os totais são os reportados pelo npm audit. Os relatórios de todas as dependências e de produção possuem escopos distintos e não devem ser somados."
                    echo "- No DAST, a tabela de severidade considera as ocorrências individuais presentes nas instâncias do relatório JSON original do ZAP."
                    echo "- A varredura DAST não comprova, por si só, a cobertura de operações autenticadas ou de autorização entre usuários."
                    echo "- A ausência de um relatório não significa ausência de vulnerabilidades."
                    echo "- A existência de um relatório, isoladamente, não comprova que a análise foi concluída com sucesso."
                    echo "- Os relatórios JSON originais são preservados para auditoria."
                    echo "- Os totais de SAST, SCA e DAST não devem ser somados automaticamente."
                    echo

                    echo "## Relatórios JSON incluídos"
                    echo

                    found=false
                    for file in "$REPORTS"/*.json; do
                      [ -f "$file" ] || continue
                      echo "- \`$(basename "$file")\`"
                      found=true
                    done

                    if [ "$found" = false ]; then
                      echo "Nenhum relatório JSON válido foi encontrado."
                    fi
                  } > "$OUTPUT"

                  cat "$OUTPUT"

            - name: Upload consolidated analysis
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: analysis-evidence-${{ inputs.treatment }}
                  path: |
                      analysis/analysis.md
                      analysis/reports/*.json
                  if-no-files-found: warn
                  retention-days: 90
